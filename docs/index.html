let lang = "en", S = null;
try { lang = localStorage.getItem("pells-lang") || "en"; } catch (e) {}
const $ = (id) => document.getElementById(id);
const t = (k) => T[lang][k];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file = (rel) => DEMO ? "samples/" + rel.split("/").map(encodeURIComponent).join("/") : "/files?path=" + encodeURIComponent(rel) + "&t=" + TOKEN;
const copy = (o) => JSON.parse(JSON.stringify(o));
function demo(path) {
  if (path === "/api/state" || path === "/api/read") return copy(DEMO.state);
  if (path === "/api/mark") return {ok: true};
  if (path === "/api/produce") { $("demoprod").hidden = false; return {text: DEMO.production_text, state: Object.assign(copy(S), {productions: copy(DEMO.productions)})}; }
  if (path === "/api/receipts") return {text: DEMO.receipts, log: DEMO.log};
  if (path === "/api/chats") return {text: DEMO.chats, log: DEMO.log};
  throw new Error("not in this page");
}

function words() {
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "en" ? "ไทย" : "English";
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll("[data-ph]").forEach((e) => { e.placeholder = t(e.dataset.ph); });
  if (S) render(S);
}
function say(text, ms) { const m = $("msg"); m.textContent = text; m.style.display = text ? "block" : "none"; if (ms) setTimeout(() => { m.style.display = "none"; }, ms); }
async function api(path, body) {
  if (DEMO) return demo(path);
  const opt = body === undefined ? {} : { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) };
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + TOKEN, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function run(fn) { say(t("working")); try { await fn(); say(t("done"), 1500); } catch (e) { say(String(e.message || e)); } }

function render(s) {
  S = s;
  ["s2","s3","s4","s5","s6","s7"].forEach((id) => { $(id).hidden = !s.has_ledger; });
  $("log").textContent = s.log || "";
  if (!s.has_ledger) return;
  $("totals").textContent = t("totals")(s.totals) + "  ·  " + s.folder;
  $("stmts").innerHTML = s.statements.map((x) => {
    const ok = x.check === "reconciled";
    return `<tr><td>${esc(x.acct || "?")}</td><td>${esc(x.start || "?")} – ${esc(x.end || "?")}</td><td class="num">${x.lines}</td><td class="num">${esc(x.begin)}</td><td class="num">${esc(x.close)}</td><td class="${ok ? "good" : "bad"}">${ok ? esc(t("reconciled")) : esc(x.check)}</td></tr>`;
  }).join("");
  let f = "";
  const list = (title, items) => items.length ? `<p><strong>${esc(title)}</strong></p><ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
  f += list(t("gaps"), s.gaps.map((g) => `${g.acct}  ${g.from} – ${g.to}`));
  f += list(t("notread"), s.not_read.map((x) => `${x.file} — ${x.status}`));
  f += list(t("unread"), s.unread_pages.map((u) => `${u.file} p.${u.page} — ${u.first_line || ""}`));
  if (s.totals.repeat_pages) f += `<p class="note">${esc(t("repeats"))}: ${s.totals.repeat_pages}</p>`;
  $("flags").innerHTML = f;
  let marked = 0;
  $("piles").innerHTML = s.piles.map((p, pi) => {
    const y = p.lines.filter((l) => l.mark === "y").length; marked += y;
    const rows = p.lines.map((l) => {
      const amt = l.debit ? `${l.debit} ${t("dr")}` : l.credit ? `${l.credit} ${t("cr")}` : "";
      return `<button class="line" data-id="${l.id}" data-mark="${esc(l.mark)}"><span class="chip">${esc(t(l.mark) || l.mark)}</span><span class="what">${esc(l.desc)}<small>${esc(l.date)} · ${esc(l.acct)} · ${esc(l.file)} p.${esc(l.page)}</small></span><span class="amt">${esc(amt)}</span></button>`;
    }).join("");
    return `<details ${p.open ? "open" : ""} data-pi="${pi}"><summary>${esc(p.pile)} <span>· ${p.lines.length} · ${y} ✓</span></summary><div class="row"><button class="plain" data-all="${pi}">${esc(t("pileall"))}</button><button class="plain" data-clear="${pi}">${esc(t("pileclear"))}</button></div>${rows}</details>`;
  }).join("");
  $("marked").textContent = t("marked")(marked);
  $("prods").innerHTML = s.productions.map((p) => `<p><strong>${esc(p.range)}</strong> · ${esc(t("next"))}: ${esc(p.next)} · <a target="_blank" href="${file(p.index)}">${esc(t("index"))}</a></p><ul>${p.files.map((x) => `<li><a target="_blank" href="${file(x)}">${esc(x.split("/").pop())}</a></li>`).join("")}</ul>`).join("");
}
const NEXT = {"":"y", "y":"n", "n":"?", "?":""};
async function mark(ids, value) { await api("/api/mark", {ids, value}); }
$("piles").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  const keepOpen = () => document.querySelectorAll("#piles details").forEach((d) => { S.piles[+d.dataset.pi].open = d.open; });
  if (b.dataset.id) {
    const v = NEXT[b.dataset.mark] === undefined ? "y" : NEXT[b.dataset.mark];
    run(async () => { await mark([b.dataset.id], v); keepOpen(); S.piles.forEach((p) => p.lines.forEach((l) => { if (l.id === b.dataset.id) l.mark = v; })); render(S); });
  } else if (b.dataset.all !== undefined || b.dataset.clear !== undefined) {
    const pi = +(b.dataset.all !== undefined ? b.dataset.all : b.dataset.clear), v = b.dataset.all !== undefined ? "y" : "";
    run(async () => { await mark(S.piles[pi].lines.map((l) => l.id), v); keepOpen(); S.piles[pi].lines.forEach((l) => { l.mark = v; }); render(S); });
  }
});
$("lang").onclick = () => { lang = lang === "en" ? "th" : "en"; try { localStorage.setItem("pells-lang", lang); } catch (e) {} words(); };
$("read").onclick = () => run(async () => render(await api("/api/read", {folder: $("folder").value})));
$("example").onclick = () => run(async () => render(await api("/api/read", {example: true})));
$("make").onclick = () => run(async () => {
  const r = await api("/api/produce", {prefix: $("prefix").value, start: +$("start").value || 1, unit: $("unit").value, first_page: $("first").checked, replace: $("replace").checked});
  $("prodtext").hidden = false; $("prodtext").textContent = r.text; render(r.state);
});
const side = (kind, pre, body) => run(async () => { const r = await api("/api/" + kind, body); $(pre).hidden = false; $(pre).textContent = r.text; $("log").textContent = r.log; if (S) S.log = r.log; });
$("rgo").onclick = () => side("receipts", "rtext", {folder: $("rfolder").value});
$("rex").onclick = () => side("receipts", "rtext", {example: true});
$("cgo").onclick = () => side("chats", "ctext", {folder: $("cfolder").value});
$("cex").onclick = () => side("chats", "ctext", {example: true});
const drop = $("drop");
["dragenter","dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => run(async () => {
  for (const f of e.dataTransfer.files) {
    if (!/\.pdf$/i.test(f.name)) continue;
    const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name) + "&t=" + TOKEN, {method:"POST", body: f});
    if (!r.ok) throw new Error((await r.json()).error);
  }
  render(await api("/api/read", {uploads: true}));
}));
if (DEMO) { document.body.classList.add("demo"); $("demobar").hidden = false; $("kit").href = DEMO.kit; }
words();
api("/api/state").then(render).catch((e) => say(String(e.message || e)));
</script>
</body>
